name: AegisRAG CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test & Validate Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-prod.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Pytest Unit & API Contract Tests
        run: |
          pytest -v tests/

      - name: Run Guardrail Indicator Regression Tests
        run: |
          pytest -v tests/test_guardrails.py

      - name: Smoke Test Document Chunking & Parsing
        run: |
          pytest -v tests/test_chunker.py tests/test_loaders.py
