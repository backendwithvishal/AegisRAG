version: '3.8'

services:
  aegis-rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegis_rag_service
    ports:
      - "8000:8000"
    environment:
      - PORTKEY_API_KEY=${PORTKEY_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_FALLBACK_API_KEY=${GROQ_FALLBACK_API_KEY}
      - JUDGE_GROQ=${JUDGE_GROQ}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - QDRANT_CLUSTER_ENDPOINT=${QDRANT_CLUSTER_ENDPOINT:-http://qdrant-local:6333}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-true}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-rag_scale_test}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
    volumes:
      - ./processed_data:/app/processed_data
      - ./checkpoints.db:/app/state_checkpoint.db
      - ./feedback.db:/app/feedback.db
    depends_on:
      - qdrant-local
    restart: unless-stopped

  qdrant-local:
    image: qdrant/qdrant:latest
    container_name: aegis_qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
